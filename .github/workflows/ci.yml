name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # 仓库的第三方依赖为零，但 **workspace 之间的链接必须装出来**：
      # npm ci 会在根 node_modules 下建 @course/* 的符号链接，测试才能 import '@course/xxx'。
      # 跳过这一步的话，fresh runner 上所有 import @course/* 都会直接失败（踩过）。
      - name: 安装 workspace 链接
        run: npm ci
      - name: 单元与集成测试
        run: npm test

# 说明：npm run test:ui 打开的是真浏览器（Playwright 驱动本机 Chrome），
# 需要额外装浏览器与依赖，本地与服务器上跑更合适，不放进 CI。
